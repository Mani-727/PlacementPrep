<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Problem | PlacementPrep</title>

    <link rel="icon" type="image/jpeg" href="../assets/placementprep-logo.jpg">
    <link rel="stylesheet" href="../css/theme.css">

    <style>
        body {
            background: var(--bg);
            color: var(--text);
        }

        /* Navbar */
        .coding-navbar {
            height: 76px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-shadow: var(--shadow);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 10px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .back-btn:hover {
            background: var(--surface-2, #f0e8ff);
            transform: translateX(-2px);
        }

        /* Container */
        .coding-container {
            max-width: 1250px;
            margin: 28px auto;
            padding: 0 20px 50px;
        }

        /* Two-column layout */
        .coding-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            align-items: start;
        }

        /* Panels */
        .panel {
            background: var(--surface);
            padding: 27px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* Problem panel */
        .problem-panel h1 {
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 12px;
        }

        .difficulty {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 8px;
            background: #f0e8ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .description {
            color: var(--muted);
            line-height: 1.75;
            margin-bottom: 27px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 17px;
        }

        .example-box {
            background: #faf7ff;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            line-height: 1.6;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }

        .constraints {
            color: var(--muted);
            line-height: 1.7;
        }

        /* Editor */
        .editor-panel {
            position: sticky;
            top: 20px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 13px;
        }

        .editor-header h2 {
            color: var(--primary);
            font-size: 22px;
        }

        select {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* Code editor */
        textarea {
            width: 100%;
            height: 400px;
            resize: vertical;
            background: #211b29;
            color: #f9f7ff;
            border: 1px solid #382d43;
            border-radius: 12px;
            padding: 18px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            border-color: #8b68b7;
            box-shadow: 0 0 0 2px rgba(123, 74, 184, 0.12);
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            border: none;
            padding: 11px 19px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .run {
            background: #f0e8ff;
            color: var(--primary);
        }

        .submit {
            background: linear-gradient(
                135deg,
                var(--primary),
                #7b4ab8
            );
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .submit:hover {
            box-shadow: 0 8px 20px rgba(75, 38, 127, 0.22);
        }

        /* Output */
        #output {
            margin-top: 15px;
            background: #fff7ed;
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 9px;
            min-height: 55px;
            color: var(--text);
            line-height: 1.6;
        }

        /* Mobile */
        @media (max-width: 850px) {

            .coding-layout {
                grid-template-columns: 1fr;
            }

            .editor-panel {
                position: static;
            }
        }

        @media (max-width: 600px) {

            .coding-navbar {
                height: 68px;
                padding: 0 18px;
            }

            .brand img {
                width: 40px;
                height: 40px;
            }

            .brand-name {
                font-size: 19px;
            }

            .back-btn {
                font-size: 14px;
                padding: 8px 10px;
            }

            .coding-container {
                margin-top: 22px;
                padding: 0 14px 40px;
            }

            .panel {
                padding: 21px;
                border-radius: 15px;
            }

            .problem-panel h1 {
                font-size: 26px;
            }

            .editor-header {
                align-items: flex-start;
            }

            textarea {
                height: 330px;
            }

            .actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="coding-navbar">

        <div class="brand">

            <img
                src="../assets/placementprep-logo.jpg"
                alt="PlacementPrep Logo"
            >

            <span class="brand-name">
                PlacementPrep
            </span>

        </div>

        <a href="coding.html" class="back-btn">
            ← Coding Problems
        </a>

    </nav>


    <!-- Main -->
    <main class="coding-container">

        <div class="coding-layout">

            <!-- Problem Description -->
            <section class="panel problem-panel">

                <h1 id="title">
                    Coding Problem
                </h1>

                <span class="difficulty" id="difficulty">
                    Easy
                </span>

                <p class="description" id="description"></p>


                <div class="section">

                    <h3>
                        Input
                    </h3>

                    <pre class="example-box" id="input">Example input will appear here.</pre>

                </div>


                <div class="section">

                    <h3>
                        Expected Output
                    </h3>

                    <pre class="example-box" id="outputExample">Example output will appear here.</pre>

                </div>


                <div class="section">

                    <h3>
                        Constraints
                    </h3>

                    <p
                        class="constraints"
                        id="constraints"
                    >
                        Follow the problem requirements.
                    </p>

                </div>

            </section>


            <!-- Code Editor -->
            <section class="panel editor-panel">

                <div class="editor-header">

                    <h2>
                        Code Editor
                    </h2>

                    <select id="language">
                        <option>Python</option>
                        <option>Java</option>
                        <option>C++</option>
                        <option>JavaScript</option>
                    </select>

                </div>


                <textarea id="code"># Write your solution here

</textarea>


                <div class="actions">

                    <button
                        class="action-btn run"
                        onclick="runCode()"
                    >
                        ▶ Run
                    </button>

                    <button
                        class="action-btn submit"
                        onclick="submitCode()"
                    >
                        Submit
                    </button>

                </div>


                <div id="output">
                    Output will appear here...
                </div>

            </section>

        </div>

    </main>


    <script>

        const problemData = {

            1: {
                title: "Two Sum",
                difficulty: "Easy",
                description:
                    "Given an array of integers and a target value, find two numbers whose sum equals the target.",
                input: "[2, 7, 11, 15], target = 9",
                output: "[0, 1]",
                constraints: "Assume exactly one valid solution exists."
            },

            2: {
                title: "Reverse a String",
                difficulty: "Easy",
                description:
                    "Write a program to reverse a given string.",
                input: "hello",
                output: "olleh",
                constraints: "The string may contain letters and numbers."
            },

            3: {
                title: "Find Maximum Element",
                difficulty: "Easy",
                description:
                    "Find the largest element in an integer array.",
                input: "[10, 4, 25, 7, 15]",
                output: "25",
                constraints: "Array contains at least one element."
            },

            4: {
                title: "Palindrome Number",
                difficulty: "Easy",
                description:
                    "Check whether a given number is a palindrome.",
                input: "121",
                output: "true",
                constraints: "Input is a positive integer."
            },

            5: {
                title: "Valid Parentheses",
                difficulty: "Medium",
                description:
                    "Determine whether all brackets in the expression are properly matched.",
                input: "{[()]}",
                output: "true",
                constraints: "Expression contains (), {}, and []."
            },

            6: {
                title: "Longest Substring",
                difficulty: "Medium",
                description:
                    "Find the length of the longest substring without repeating characters.",
                input: "abcabcbb",
                output: "3",
                constraints: "String length can be large."
            },

            7: {
                title: "Binary Search",
                difficulty: "Medium",
                description:
                    "Search for a target element in a sorted array using binary search.",
                input: "[1,3,5,7,9], target = 7",
                output: "3",
                constraints: "Array is sorted in ascending order."
            },

            8: {
                title: "Maximum Subarray",
                difficulty: "Medium",
                description:
                    "Find the maximum possible sum of a contiguous subarray.",
                input: "[-2,1,-3,4,-1,2,1,-5,4]",
                output: "6",
                constraints: "Array contains positive and negative integers."
            },

            9: {
                title: "Merge Intervals",
                difficulty: "Hard",
                description:
                    "Merge all overlapping intervals.",
                input: "[[1,3],[2,6],[8,10],[9,12]]",
                output: "[[1,6],[8,12]]",
                constraints: "Intervals may overlap."
            }

        };


        const params =
            new URLSearchParams(window.location.search);

        const id =
            params.get("id") || "1";

        const problem =
            problemData[id] || problemData["1"];


        document.getElementById("title").textContent =
            problem.title;

        document.getElementById("difficulty").textContent =
            problem.difficulty;

        document.getElementById("description").textContent =
            problem.description;

        document.getElementById("input").textContent =
            problem.input;

        document.getElementById("outputExample").textContent =
            problem.output;

        document.getElementById("constraints").textContent =
            problem.constraints;


        function runCode() {

            const language =
                document.getElementById("language").value;

            document.getElementById("output").textContent =
                `Code execution preview for ${language}. Real execution engine will be connected later.`;

        }


        function submitCode() {

            const code =
                document.getElementById("code").value.trim();


            if (!code) {

                document.getElementById("output").textContent =
                    "Please write some code before submitting.";

                return;
            }


            localStorage.setItem(
                "lastCodingSubmission",
                JSON.stringify({
                    problemId: id,
                    language:
                        document.getElementById("language").value,
                    code: code,
                    submittedAt:
                        new Date().toISOString()
                })
            );


            document.getElementById("output").textContent =
                "✅ Submission recorded successfully!";

        }

    </script>

</body>
</html>
