        rel="icon"
        type="image/jpeg"
        href="../assets/placementprep-logo.jpg">

        rel="stylesheet"
        href="../css/theme.css">


    <style>

        body {
            background: var(--bg);
            color: var(--text);
        }


        /* ================================
           NAVBAR
           ================================ */

        .company-navbar {
            height: 76px;
            background: var(--surface);

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 40px;

            box-shadow: var(--shadow);
            border-bottom: 1px solid var(--border);
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .brand img {
            width: 45px;
            height: 45px;

            object-fit: cover;
            border-radius: 50%;
        }


        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }


        .back-btn {
            color: var(--primary);
            text-decoration: none;

            font-weight: 600;

            padding: 10px 16px;

            border-radius: 10px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .back-btn:hover {
            background: var(--surface-2, #f0e8ff);
            transform: translateX(-2px);
        }


        /* ================================
           CONTAINER
           ================================ */

        .company-container {
            max-width: 1000px;

            margin: 45px auto;

            padding: 0 22px 50px;
        }


        /* ================================
           HERO
           ================================ */

        .company-hero {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #7b4ab8
                );

            color: white;

            padding: 38px;

            border-radius: 20px;

            margin-bottom: 25px;

            box-shadow:
                0 14px 30px
                rgba(75, 38, 127, 0.18);
        }


        .company-hero::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -55px;
            top: -70px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.10);
        }


        .company-hero h1 {
            position: relative;

            z-index: 1;

            font-size: 34px;

            margin-bottom: 10px;
        }


        .company-hero p {
            position: relative;

            z-index: 1;

            opacity: 0.92;

            line-height: 1.6;

            max-width: 700px;

            margin-bottom: 15px;
        }


        .company-type {
            position: relative;

            z-index: 1;

            display: inline-block;

            padding: 6px 12px;

            background:
                rgba(255, 255, 255, 0.16);

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        /* ================================
           PREPARATION GRID
           ================================ */

        .preparation-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .preparation-card {

            background: var(--surface);

            padding: 26px;

            border-radius: 18px;

            border:
                1px solid
                var(--border);

            box-shadow: var(--shadow);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .preparation-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 14px 30px
                rgba(75, 38, 127, 0.11);
        }


        /* ================================
           ICON
           ================================ */

        .card-icon {

            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #f0e8ff;

            border-radius: 15px;

            font-size: 30px;

            margin-bottom: 16px;
        }


        .preparation-card h2 {

            color: var(--primary);

            font-size: 21px;

            margin-bottom: 14px;
        }


        .preparation-card ul {

            padding-left: 20px;

            color: var(--muted);

            line-height: 2;

            margin: 0;
        }


        .preparation-card li::marker {

            color: var(--accent);
        }


        /* ================================
           CARD ACCENTS
           ================================ */

        .aptitude-card {
            border-top:
                4px solid var(--accent);
        }


        .technical-card {
            border-top:
                4px solid var(--primary);
        }


        .core-card {
            border-top:
                4px solid #9b7ac8;
        }


        .interview-card {
            border-top:
                4px solid #d78a42;
        }


        /* ================================
           SKILLS SECTION
           ================================ */

        .skills-section {

            background: var(--surface);

            margin-top: 20px;

            padding: 25px;

            border-radius: 18px;

            border:
                1px solid
                var(--border);

            box-shadow: var(--shadow);
        }


        .skills-section h2 {

            color: var(--primary);

            font-size: 21px;

            margin-bottom: 15px;
        }


        .skills-list {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;
        }


        .skill {

            padding: 8px 13px;

            background: #f0e8ff;

            color: var(--primary);

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        /* ================================
           PROCESS SECTION
           ================================ */

        .process-section {

            background: var(--surface);

            margin-top: 20px;

            padding: 25px;

            border-radius: 18px;

            border:
                1px solid
                var(--border);

            box-shadow: var(--shadow);
        }


        .process-section h2 {

            color: var(--primary);

            font-size: 21px;

            margin-bottom: 18px;
        }


        .process-list {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;
        }


        .process-step {

            background: #faf8ff;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            padding: 15px;

            text-align: center;
        }


        .process-number {

            width: 32px;
            height: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 9px;

            border-radius: 50%;

            background: var(--primary);

            color: white;

            font-size: 13px;

            font-weight: 700;
        }


        .process-step span:last-child {

            color: var(--text);

            font-size: 12px;

            font-weight: 600;

            line-height: 1.4;
        }


        /* ================================
           NOT FOUND
           ================================ */

        .not-found {

            text-align: center;

            background: var(--surface);

            padding: 50px 20px;

            border-radius: 18px;

            border:
                1px solid
                var(--border);

            box-shadow: var(--shadow);
        }


        .not-found h2 {

            color: var(--primary);

            margin-bottom: 10px;
        }


        .not-found p {

            color: var(--muted);

            margin-bottom: 20px;
        }


        .not-found a {

            display: inline-block;

            background: var(--primary);

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 9px;

            font-weight: 700;
        }


        /* ================================
           MOBILE
           ================================ */

        @media (max-width: 700px) {

            .company-navbar {

                height: 68px;

                padding: 0 18px;
            }


            .brand img {

                width: 40px;
                height: 40px;
            }


            .brand-name {

                font-size: 19px;
            }


            .back-btn {

                font-size: 14px;

                padding: 8px 10px;
            }


            .company-container {

                margin-top: 30px;

                padding:
                    0 15px 40px;
            }


            .company-hero {

                padding: 28px 23px;

                border-radius: 17px;
            }


            .company-hero h1 {

                font-size: 28px;
            }


            .preparation-grid {

                grid-template-columns: 1fr;
            }


            .preparation-card {

                padding: 22px;
            }


            .process-list {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        @media (max-width: 450px) {

            .process-list {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>
