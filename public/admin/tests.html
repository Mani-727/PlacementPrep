<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tests | PlacementPrep Admin</title>

    <link rel="icon" type="image/jpeg" href="../assets/placementprep-logo.jpg">
    <link rel="stylesheet" href="../css/theme.css">

    <style>

        body {
            background: var(--bg);
            color: var(--text);
        }

        /* Navbar */
        .admin-navbar {
            height: 76px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-text {
            color: var(--primary);
            font-size: 21px;
            font-weight: 700;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 9px;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: var(--surface-2, #f0e8ff);
        }

        /* Container */
        .container {
            max-width: 1050px;
            margin: 45px auto;
            padding: 0 22px 50px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--muted);
            line-height: 1.6;
        }

        /* Main Card */
        .card {
            background: var(--surface);
            padding: 28px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* Form */
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75, 38, 127, 0.08);
        }

        input::placeholder {
            color: var(--muted);
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            background: linear-gradient(
                135deg,
                var(--primary),
                #7b4ab8
            );
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(75, 38, 127, 0.2);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 28px;
        }

        th {
            text-align: left;
            padding: 14px;
            background: var(--surface-2, #f3edff);
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
        }

        td {
            text-align: left;
            padding: 15px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #faf7ff;
        }

        /* Mobile */
        @media (max-width: 700px) {

            .admin-navbar {
                padding: 0 18px;
                height: 68px;
            }

            .brand img {
                width: 40px;
                height: 40px;
            }

            .brand-text {
                font-size: 18px;
            }

            .back-btn {
                font-size: 14px;
                padding: 8px 10px;
            }

            .container {
                margin-top: 30px;
                padding: 0 15px 40px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .card {
                padding: 20px;
            }

            .row {
                flex-direction: column;
                align-items: stretch;
            }

            input,
            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <!-- Navbar -->
    <nav class="admin-navbar">

        <div class="brand">

            <img
                src="../assets/placementprep-logo.jpg"
                alt="PlacementPrep Logo"
            >

            <span class="brand-text">
                PlacementPrep Admin
            </span>

        </div>


        <a
            href="admin-dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </nav>


    <!-- Main -->
    <main class="container">

        <div class="page-header">

            <h1>
                Test Management 📝
            </h1>

            <p>
                Create and manage placement tests.
            </p>

        </div>


        <div class="card">

            <!-- Create Test -->
            <div class="row">

                <input
                    id="title"
                    placeholder="Test title"
                >

                <input
                    id="duration"
                    type="number"
                    placeholder="Duration (minutes)"
                >

                <input
                    id="total"
                    type="number"
                    placeholder="Questions"
                >

                <button onclick="createTest()">
                    Create Test
                </button>

            </div>


            <!-- Tests Table -->
            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Test</th>
                            <th>Duration</th>
                            <th>Questions</th>
                        </tr>

                    </thead>

                    <tbody id="testTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script>

        function createTest() {

            const title =
                document.getElementById("title").value;

            const duration =
                document.getElementById("duration").value;

            const total =
                document.getElementById("total").value;


            if (!title || !duration || !total) {

                alert("Please fill all fields.");

                return;
            }


            document.getElementById("testTable").innerHTML += `

                <tr>

                    <td>
                        ${title}
                    </td>

                    <td>
                        ${duration} minutes
                    </td>

                    <td>
                        ${total}
                    </td>

                </tr>

            `;


            document.getElementById("title").value = "";

            document.getElementById("duration").value = "";

            document.getElementById("total").value = "";

        }

    </script>

</body>

</html>
