<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | PlacementPrep</title>

    <link rel="icon" type="image/jpeg" href="../assets/placementprep-logo.jpg">
    <link rel="stylesheet" href="../css/theme.css">

    <style>

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 45px rgba(75, 38, 127, 0.12);
        }


        /* =========================
           LOGO
        ========================== */

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 8px 25px rgba(75, 38, 127, 0.15);
        }

        .brand-name {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }


        /* =========================
           HEADING
        ========================== */

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================== */

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75, 38, 127, 0.08);
        }

        input::placeholder {
            color: var(--muted);
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(
                135deg,
                var(--primary),
                #7b4ab8
            );
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(75, 38, 127, 0.22);
        }


        /* =========================
           MESSAGE
        ========================== */

        #message {
            margin-top: 15px;
            min-height: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           ADMIN NOTE
        ========================== */

        .admin-note {
            margin-top: 25px;
            padding: 12px 14px;
            border-radius: 9px;
            background: #fff3df;
            color: #8a5714;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            body {
                padding: 18px;
            }

            .admin-login-card {
                padding: 30px 22px;
            }

            .logo-area img {
                width: 72px;
                height: 72px;
            }

            h1 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <div class="admin-login-card">


        <!-- LOGO -->

        <div class="logo-area">

            <img
                src="../assets/placementprep-logo.jpg"
                alt="PlacementPrep Logo"
            >

            <div class="brand-name">
                PlacementPrep
            </div>

        </div>


        <!-- HEADING -->

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Placement Preparation Portal
        </p>


        <!-- LOGIN FORM -->

        <form id="adminForm">


            <div class="group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login as Admin
            </button>


            <div id="message"></div>


        </form>


        <div class="admin-note">
            🔐 Authorized administrators only
        </div>


    </div>



    <script>


        document
            .getElementById("adminForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value;


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (
                    email === "admin@ppp.com" &&
                    password === "admin123"
                ) {

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "admin-dashboard.html";


                } else {

                    const message =
                        document.getElementById("message");


                    message.textContent =
                        "Invalid admin credentials.";


                    message.style.color =
                        "#b91c1c";

                }

            });

    </script>


</body>

</html>
